<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- iOS turns long digit runs (the seed, the version) into phone-call links. -->
    <meta name="format-detection" content="telephone=no" />
    <title>mhj-dojo - 麻雀道場</title>
    <meta name="description" content="役ごとの向聴と有効牌を見ながら、一人打ちの練習もCPU対戦もできる麻雀道場" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <!-- %BASE_URL% is Vite's own placeholder (resolved from `base` in
         vite.config.ts) so these public/ files resolve under the site
         build's subpath too. -->
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mhj-dojo 麻雀道場" />
    <meta property="og:title" content="mhj-dojo 麻雀道場" />
    <meta property="og:description" content="役ごとの向聴と有効牌を見ながら、一人打ちの練習もCPU対戦もできる麻雀道場" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mhj-dojo 麻雀道場" />
    <meta name="twitter:description" content="役ごとの向聴と有効牌を見ながら、一人打ちの練習もCPU対戦もできる麻雀道場" />
    <!-- og:url / og:image / twitter:image are absolute and only make sense
         for the published site; the mhj-dojo-site-og-tags plugin
         (vite.config.ts) injects them for `--mode site` only, so the
         embedded build's index.html stays byte-stable across builds. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
