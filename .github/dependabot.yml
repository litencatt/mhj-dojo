version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The web frontend (Vite, Preact, Playwright, TypeScript). Minor and patch
  # updates come as one grouped PR a week; a major update gets its own PR.
  # @types/node follows the Node the workflows run (node-version: 24), so its
  # major goes up with that by hand, not on its own.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
