name: Release site

# Opens the site release pull request (issue #75). The site is published from
# the lolipop-deploy-now branch: Lolipop Deploy Now's GitHub integration
# watches it (framework: static, no install or build command, output
# directory web/dist-site) and publishes each merge into it.
#
# tagpr.yml calls this with the tag of each release (v2026.09.27.0), right
# after tagpr creates it; it can also be run by hand, for a tag or for main
# as it is (no release version then).
#
# Deploy Now can't build the Go WebAssembly engine, so the branch carries
# the built site, which main doesn't (web/dist-site is gitignored there).
# This workflow builds the tag (or main) with the release version in the
# header, runs the site's E2E tests on the build, merges the tagged commit
# into a release branch cut from lolipop-deploy-now, commits the build there
# and opens a pull request into lolipop-deploy-now listing what it brings.
# Merge it with a merge commit (not squash), so the next release merges
# cleanly. `make deploy` still deploys by hand.
#
# Pull requests opened with the workflow's token don't trigger CI, so the
# site's E2E tests run here; main's own CI has run the rest.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build (e.g. v2026.09.27.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build (e.g. v2026.09.27.0); empty for main as it is
        type: string
        required: false

permissions:
  contents: write # push the release branch (and create lolipop-deploy-now once)
  pull-requests: write

env:
  RELEASE_BRANCH: lolipop-deploy-now

jobs:
  release:
    name: Build the release and open a site release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-site
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || 'main' }}
          fetch-depth: 0 # merge into the release branch, list the commits
      - name: Anything to release?
        id: check
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            git fetch -q origin "$RELEASE_BRANCH"
            if [ -z "$(git rev-list "origin/$RELEASE_BRANCH..HEAD")" ]; then
              echo "::notice::$RELEASE_BRANCH already has $(git rev-parse --short HEAD); nothing to release"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Build the tagged commit itself (not the merge below), so the site and
      # its engine report its commit, and the header shows the release.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.release == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        if: steps.check.outputs.release == 'true'
        env:
          MHJDOJO_RELEASE: ${{ inputs.tag }}
        run: make site
      - name: Get installed Playwright version
        if: steps.check.outputs.release == 'true'
        id: playwright-version
        working-directory: web
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.check.outputs.release == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.check.outputs.release == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's OS dependencies
        if: steps.check.outputs.release == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Site E2E tests
        if: steps.check.outputs.release == 'true'
        working-directory: web
        run: npm run e2e:site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-site
          path: web/playwright-report-site/
          retention-days: 7

      - name: Commit the build to a release branch
        if: steps.check.outputs.release == 'true'
        id: branch
        env:
          SHA: ${{ steps.check.outputs.sha }}
          SHORT: ${{ steps.check.outputs.short }}
        run: |
          for f in index.html version.json mhj-dojo.wasm wasm_exec.js worker.js THIRD_PARTY_LICENSES.txt; do
            [ -f "web/dist-site/$f" ] || { echo "::error::web/dist-site/$f is missing"; exit 1; }
          done
          mv web/dist-site "$RUNNER_TEMP/dist-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The first release starts lolipop-deploy-now at main.
          if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            git push -q origin "$SHA:refs/heads/$RELEASE_BRANCH"
            git fetch -q origin "$RELEASE_BRANCH"
          fi
          branch="release/${TAG:-$(TZ=Asia/Tokyo date +%Y%m%d)-$SHORT}"
          git switch -q -c "$branch" "origin/$RELEASE_BRANCH"
          git merge -q --no-ff --no-edit -m "Merge ${TAG:-main} ($SHORT) for release" "$SHA"
          rm -rf web/dist-site
          cp -R "$RUNNER_TEMP/dist-site" web/dist-site
          git add -f web/dist-site # gitignored on main
          git commit -q -m "Build the site from ${TAG:-$SHORT}" -m "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}"
          git push -q --force origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the release pull request
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.sha }}
          SHORT: ${{ steps.check.outputs.short }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          # What main brings since the last release: its merged pull requests
          # (a merge commit's body is the pull request's title) and any
          # commit pushed to main directly.
          changes=$(git log --first-parent --format='%h%x1f%s%x1f%b%x1e' "origin/$RELEASE_BRANCH..$SHA" | python3 -c '
          import re, sys
          for rec in sys.stdin.read().split("\x1e"):
              parts = rec.strip("\n").split("\x1f")
              if len(parts) < 2:
                  continue
              sha, subject, body = parts[0], parts[1], parts[2] if len(parts) > 2 else ""
              m = re.match(r"Merge pull request (#\d+)", subject)
              title = f"{body.strip().splitlines()[0]} ({m.group(1)})" if m and body.strip() else subject
              print(f"- {title} {sha}")
          ')
          {
            if [ -n "$TAG" ]; then
              echo "リリース [$TAG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG)（\`$SHORT\`）を公開用ブランチ \`$RELEASE_BRANCH\` に取り込み、ビルドした公開サイト（\`web/dist-site\`。ヘッダーに $TAG と表示）を含めます。マージすると、デプロイナウが公開します。"
            else
              echo "main（\`$SHORT\`）を公開用ブランチ \`$RELEASE_BRANCH\` に取り込み、ビルドした公開サイト（\`web/dist-site\`）を含めます。リリースのタグなしのビルドなので、ヘッダーにはコミットが表示されます。マージすると、デプロイナウが公開します。"
            fi
            echo
            echo "**「Create a merge commit」でマージしてください**（squash しない）。次回のリリースで main をきれいに取り込むためです。"
            echo
            echo "## 前回のリリース以降の変更"
            echo "$changes"
            echo
            echo "## 確認"
            echo "- 公開サイト版の E2E: 成功（[ワークフローの実行](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})）"
            echo "- main の CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}"
          } > "$RUNNER_TEMP/body.md"
          if url=$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null); then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          else
            url=$(gh pr create --base "$RELEASE_BRANCH" --head "$BRANCH" \
              --title "Release ${TAG:-$SHORT ($(TZ=Asia/Tokyo date +%Y-%m-%d))} to Deploy Now" --body-file "$RUNNER_TEMP/body.md")
          fi
          echo "Release pull request: $url" >> "$GITHUB_STEP_SUMMARY"
