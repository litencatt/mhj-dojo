name: tagpr

# Releases (.tagpr): on every push to main, tagpr keeps a release pull request
# up to date (CHANGELOG.md from GitHub's generated release notes). When that
# pull request is merged, the next run tags the merge (v2026.0927.0) and
# creates the GitHub Release, and build-site-release.yml builds the site,
# attaches it to that Release, and (via deploy-lolipop.yml) opens the site
# release pull request into lolipop-deploy-now for Lolipop Deploy Now to
# publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A second run on an already-released merge (GitHub can deliver the
      # push twice) would tag the same commit again (v2026.1005.1 on
      # v2026.1005.0's commit), so skip tagpr when the commit already has a
      # release tag with its GitHub Release. A tag without its Release (a run
      # that failed halfway) still runs tagpr, as before.
      - id: tagged
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v[0-9]*')
          tag=$(awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2; exit }' <<<"$refs")
          if [ -n "$tag" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${SHA} is already released as ${tag}; skipping tagpr"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - id: tagpr
        if: steps.tagged.outputs.skip != 'true'
        uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        with:
          version: v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo # the CalVer date is the date in Japan

  # A tag made with GITHUB_TOKEN starts no other workflow, so the site build
  # (and, through it, the deploy) is called from here.
  build-site-release:
    name: Build site release
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    uses: ./.github/workflows/build-site-release.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
