name: tagpr

# Releases (.tagpr): on every push to main, tagpr keeps a release pull request
# up to date (CHANGELOG.md from GitHub's generated release notes). When that
# pull request is merged, the next run tags the merge (v2026.0927.0) and
# creates the GitHub Release, and build-site-release.yml builds the site,
# attaches it to that Release, and (via deploy-lolipop.yml) opens the site
# release pull request into lolipop-deploy-now for Lolipop Deploy Now to
# publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        with:
          version: v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tokyo # the CalVer date is the date in Japan

  # A tag made with GITHUB_TOKEN starts no other workflow, so the site build
  # (and, through it, the deploy) is called from here.
  build-site-release:
    name: Build site release
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    uses: ./.github/workflows/build-site-release.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
