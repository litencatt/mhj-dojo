name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # The test jobs keep their own build caches: with setup-go's cache they
  # shared one key, so only the first job to save it (with or without -race)
  # found its builds there, and the cache never refreshed after a hit. Each
  # push to main saves a fresh cache; pull requests only restore it.
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-
      # go vet runs in golangci-lint (the standard set includes govet).
      # Full-size oracle and property tests; too slow to also run under -race.
      - run: go test -count=1 ./...
      - run: go build -o bin/mhj2 ./cmd/mhj2
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}

  go-test-race:
    name: Go test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-race-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-test-race-${{ runner.os }}-${{ hashFiles('go.mod') }}-
      # -short shrinks the CPU-bound random/oracle loops and skips whole-game
      # playthroughs, which run on one goroutine; the race detector only adds
      # value for the concurrency paths (session, store, match via server).
      - run: go test -race -short -count=1 ./...
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-test-race-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Embedded assets are up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain internal/server/static)" ]; then
            git status --short internal/server/static
            echo "::error::internal/server/static is stale; run 'make web' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
