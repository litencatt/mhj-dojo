name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # The test jobs keep their own build caches: with setup-go's cache they
  # shared one key, so only the first job to save it (with or without -race)
  # found its builds there, and the cache never refreshed after a hit. Each
  # push to main saves a fresh cache; pull requests only restore it.
  #
  # Both test jobs split the packages into groups that run on parallel
  # runners, balanced by measured test time. "rest" is every package not
  # named in another group (so new packages land there): keep its grep in
  # step with the other groups' package lists.
  go-test:
    name: Go test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: games
            packages: ./internal/cpu ./internal/game ./internal/match
          - group: oracles
            packages: ./internal/yakushanten ./internal/shanten ./internal/handshape ./internal/advice
          - group: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-test-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-
      # go vet runs in golangci-lint (the standard set includes govet).
      # The reduced, fixed-seed subset of the oracle, property and self-play
      # tests (internal/testmode); the nightly workflow runs the exhaustive
      # loops with MHJDOJO_FULL=1.
      - name: go test
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          if [ -z "$PACKAGES" ]; then
            PACKAGES=$(go list ./... | grep -v -E '/internal/(cpu|game|match|yakushanten|shanten|handshape|advice)$')
          fi
          go test -count=1 $PACKAGES
      - if: matrix.group == 'rest'
        run: go build -o bin/mhj-dojo ./cmd/mhj-dojo
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-test-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}

  go-test-race:
    name: Go test race (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: games
            packages: ./internal/cpu ./internal/game ./internal/match
          - group: oracles
            packages: ./internal/yakushanten ./internal/shanten ./internal/handshape ./internal/advice
          - group: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-race-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-test-race-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-
      # -short shrinks the CPU-bound random/oracle loops and skips whole-game
      # playthroughs, which run on one goroutine; the race detector only adds
      # value for the concurrency paths (session, store, match via server).
      - name: go test -race -short
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          if [ -z "$PACKAGES" ]; then
            PACKAGES=$(go list ./... | grep -v -E '/internal/(cpu|game|match|yakushanten|shanten|handshape|advice)$')
          fi
          go test -race -short -count=1 $PACKAGES
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-test-race-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build needs the WASM engine: the site job builds it.

  # The static site (issue #67): the engine built as WebAssembly and the site
  # built on it, which mhj-dojo embeds and serves (issue #147), then the E2E
  # tests in the browser against mhj-dojo. Build site release runs the same
  # tests on the release build as vite preview serves it.
  site:
    name: Static site (WASM) build + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: go vet (js/wasm)
        working-directory: .
        run: GOOS=js GOARCH=wasm go vet ./cmd/mhj-dojo-wasm/...
      - run: npm ci
      - name: Build the site and embed it
        working-directory: .
        run: make embed
      - name: WASM size
        working-directory: .
        # Budget guards against a size regression, including GOEXPERIMENT=
        # nojsonv2 (Makefile's wasm target) silently stopping being applied,
        # e.g. after a Go upgrade removes the experiment.
        run: |
          size=$(wc -c < web/site-public/mhj-dojo.wasm)
          budget=4823449 # 4.6 MiB
          echo "mhj-dojo.wasm: $size bytes, gzip -9 $(gzip -9c web/site-public/mhj-dojo.wasm | wc -c) bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::mhj-dojo.wasm is $size bytes, over the $budget budget"
            exit 1
          fi
      # The Go test jobs run without the site build: check here that the
      # server embeds it.
      - name: go test (embedded frontend)
        working-directory: .
        run: go test -count=1 -run '^TestEmbeddedFrontend$' ./internal/server
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
      # The Release site workflow builds with the release tag in the header:
      # check that build's version tests too (the help's included).
      - name: Site version tests on a release build
        env:
          MHJDOJO_RELEASE: v2000.0101.0
        run: |
          make -C .. embed
          npx playwright test e2e/site/version.spec.ts e2e/shared/help.spec.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
