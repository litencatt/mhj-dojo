name: CI

# The push to main that merges the release pull request changes only
# CHANGELOG.md and skips CI (the tag's build is verified by
# build-site-release.yml). Deploy pull requests into lolipop-deploy-now
# carry only main's already-checked commits plus web/dist-site, so pull
# requests run CI only against main; verify-live.yml checks the deploy.
on:
  push:
    branches: [main]
    paths-ignore: [CHANGELOG.md]
  pull_request:
    branches: [main]
    paths-ignore: [CHANGELOG.md]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # The test job keeps its own build cache: each push to main saves a fresh
  # one; pull requests only restore it.
  #
  # It splits the packages into groups that run on parallel runners, balanced
  # by measured test time. "rest" is every package not named in another group
  # (so new packages land there): keep its grep in step with the other
  # groups' package lists.
  go-test:
    name: Go test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: games
            packages: ./internal/cpu ./internal/game ./internal/match
          - group: oracles
            packages: ./internal/yakushanten ./internal/shanten ./internal/handshape ./internal/advice
          - group: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-test-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-
      # go vet runs in golangci-lint (the standard set includes govet).
      # The reduced, fixed-seed subset of the oracle, property and self-play
      # tests (internal/testmode); the nightly workflow runs the exhaustive
      # loops with MHJDOJO_FULL=1.
      - name: go test
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          if [ -z "$PACKAGES" ]; then
            PACKAGES=$(go list ./... | grep -v -E '/internal/(cpu|game|match|yakushanten|shanten|handshape|advice)$')
          fi
          go test -count=1 $PACKAGES
      - if: matrix.group == 'rest'
        run: go build -o bin/mhj-dojo ./cmd/mhj-dojo
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-test-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.sha }}

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build needs the WASM engine: the site job builds it.

  # The static site (issue #67): the engine built as WebAssembly and the site
  # built on it, which mhj-dojo embeds and serves (issue #147). This job
  # builds it and the mhj-dojo binaries (a normal build and one with a release
  # in the header); the E2E job below runs the browser tests against them, in
  # shards. Build site release runs the same tests on the release build, on
  # mhj-dojo too.
  site:
    name: Static site (WASM) build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: go vet (js/wasm)
        working-directory: .
        run: GOOS=js GOARCH=wasm go vet ./cmd/mhj-dojo-wasm/...
      - run: npm ci
      - name: Build the site and embed it
        working-directory: .
        run: make embed
      - name: WASM size
        working-directory: .
        # Budget guards against a size regression, including GOEXPERIMENT=
        # nojsonv2 (Makefile's wasm target) silently stopping being applied,
        # e.g. after a Go upgrade removes the experiment.
        run: |
          size=$(wc -c < web/site-public/mhj-dojo.wasm)
          budget=4823449 # 4.6 MiB
          echo "mhj-dojo.wasm: $size bytes, gzip -9 $(gzip -9c web/site-public/mhj-dojo.wasm | wc -c) bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::mhj-dojo.wasm is $size bytes, over the $budget budget"
            exit 1
          fi
      # The Go test jobs run without the site build: check here that the
      # server embeds it.
      - name: go test (embedded frontend)
        working-directory: .
        run: go test -count=1 -run '^TestEmbeddedFrontend$' ./internal/server
      - name: Build mhj-dojo
        working-directory: .
        run: go build -o bin/mhj-dojo ./cmd/mhj-dojo
      # The Release site workflow builds with the release tag in the header:
      # build that too, for the version tests (the help's included).
      - name: Build mhj-dojo with a release build of the site
        working-directory: .
        env:
          MHJDOJO_RELEASE: v2000.0101.0
        # Only the site is built again (the WASM engine is the same).
        run: |
          (cd web && npm run build:site)
          rm -rf internal/server/static/dist
          cp -R web/dist-site internal/server/static/dist
          go build -o bin/mhj-dojo-release ./cmd/mhj-dojo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mhj-dojo-bin
          path: bin/
          retention-days: 1

  # The site's E2E tests in the browser against the built mhj-dojo, in
  # shards that run in parallel. A test that fails and then passes on its
  # retry stays green but is reported as a warning.
  e2e:
    name: E2E (shard ${{ matrix.shard }}/3)
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        # Playwright's --shard splits the tests by count in file order, which
        # left the slow game.spec.ts tests in one shard (2m25s against 40s
        # and 1m11s). The groups split them by duration instead: game.spec.ts
        # alone, the save/table specs, and every other spec (the negative
        # lookahead excludes the first two groups, so a new spec file runs
        # there).
        include:
          - shard: 1
            files: 'e2e/game\.spec'
          - shard: 2
            files: 'e2e/game-saves\.spec e2e/practice-saves\.spec e2e/table\.spec'
          - shard: 3
            files: 'e2e/(?!game\.spec|game-saves\.spec|practice-saves\.spec|table\.spec)'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mhj-dojo-bin
          path: bin
      - run: chmod +x ../bin/*
      - run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E tests
        env:
          MHJDOJO_BIN: ${{ github.workspace }}/bin/mhj-dojo
          E2E_FILES: ${{ matrix.files }}
          E2E_GLOBAL_TIMEOUT_MS: '480000' # 8 minutes; a shard takes about 2
        # Unquoted on purpose: the file filters are split into words; set -f
        # keeps the shell from globbing the regular expressions.
        run: set -f; npm run e2e -- $E2E_FILES
      - name: Report flaky tests
        if: always()
        run: scripts/report-flaky.sh
      # The version tests on the release build (shard 3, currently the shortest, runs them).
      - name: Site version tests on a release build
        id: release
        if: matrix.shard == 3
        env:
          MHJDOJO_BIN: ${{ github.workspace }}/bin/mhj-dojo-release
          MHJDOJO_EXPECT_RELEASE: v2000.0101.0
          E2E_GLOBAL_TIMEOUT_MS: '240000' # 4 minutes; the two specs take about 15 seconds
        run: npx playwright test e2e/version.spec.ts e2e/help.spec.ts
      - name: Report flaky release-build tests
        if: always() && steps.release.outcome != 'skipped'
        run: scripts/report-flaky.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7
