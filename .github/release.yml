# GitHub's generated release notes, used by tagpr for CHANGELOG.md and the
# GitHub Releases: leave out tagpr's own release pull requests, and group the
# rest by the label .github/workflows/labeler.yml adds from the head branch
# prefix (feat/, fix/, perf/, ci/, chore/, build/, test/, docs/, dependabot/).
# A pull request labelled spoiler (what opens after the 師範戦, say) is left out altogether: the
# 更新情報 page is read by players who have not got there yet.
changelog:
  exclude:
    labels:
      - tagpr
      - spoiler
  categories:
    - title: 新機能
      labels:
        - enhancement
    - title: 修正
      labels:
        - bug
    - title: パフォーマンス
      labels:
        - performance
    - title: ドキュメント
      labels:
        - documentation
    - title: CI・リポジトリ
      labels:
        - ci
        - chore
    - title: 依存関係
      labels:
        - dependencies
    - title: その他
      labels:
        - "*"
